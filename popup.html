<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>YouTube Lyrics PiP</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        width: 310px;
        margin: 0;
        padding: 18px;
        color: #f7f7f7;
        background: #111214;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 8px;
      }
      .logo {
        width: 28px;
        height: 28px;
        border-radius: 8px;
        flex: 0 0 auto;
        object-fit: cover;
      }
      h1 { margin: 0; font-size: 18px; }
      p { margin: 0 0 16px; color: #a8abb2; font-size: 13px; line-height: 1.5; }
      .option {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        margin: 0 0 16px;
        padding: 10px 12px;
        border-radius: 12px;
        background: #1b1c1f;
        cursor: pointer;
      }
      .option input {
        margin: 2px 0 0;
        width: 16px;
        height: 16px;
        flex: 0 0 auto;
        accent-color: #1ed760;
        cursor: pointer;
      }
      .option strong { display: block; font-size: 13px; }
      .option small { display: block; margin-top: 2px; color: #a8abb2; font-size: 12px; line-height: 1.4; }
      button {
        width: 100%;
        border: 0;
        border-radius: 999px;
        padding: 12px 16px;
        color: #071109;
        background: #1ed760;
        font: inherit;
        font-weight: 750;
        cursor: pointer;
      }
      button:disabled { cursor: wait; opacity: 0.65; }
      #status { min-height: 20px; margin-top: 12px; color: #ffb4ab; font-size: 12px; }
    </style>
  </head>
  <body>
    <div class="header">
      <img id="logo" class="logo" src="logo.png" alt="" />
      <h1>YouTube Lyrics PiP</h1>
    </div>
    <p>
      Play a song on YouTube or YouTube Music. A floating
      <strong>"🎵 Lyrics PiP"</strong> button will appear in the bottom-right
      corner of the page &mdash; click it to open the floating player. The
      button hides automatically while a video is fullscreen.
    </p>
    <label class="option" for="collapseFab">
      <input id="collapseFab" type="checkbox" />
      <span>
        <strong>Compact button</strong>
        <small>Collapse the floating button to just the icon, without the "Lyrics PiP" text.</small>
      </span>
    </label>
    <button id="openPip" type="button">Highlight Button on Page</button>
    <div id="status" role="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
